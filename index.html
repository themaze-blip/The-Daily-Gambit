<style>
/* Pastel dashboard theme */
:root{
  --bg:#ebe1fa; --surface:#fffaf6; --ink:#3a2e63; --muted:#7a6d9c; --line:#e6dcf5;
  --accent:#8a6ddb; --accent-ink:#ffffff;
  --sq-l:#f6f2f8; --sq-d:#5b2a86;
  --last:rgba(255,205,96,.6); --hit:rgba(255,120,150,.6);
  --pw:#ffffff; --pw-edge:#3a1d5c; --pb:#12051c; --pb-edge:rgba(255,255,255,.5);
  --good:#2b8a67; --good-bg:#d8f2e5; --warn:#9c6410; --warn-bg:#fdebc6; --bad:#c13d57; --bad-bg:#fbd9e1;
  --font-display:'Fredoka','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;

  --font-glyph:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Apple Symbols',serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
h1{font:700 clamp(26px,5vw,38px)/1.05 var(--font-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:14px;min-width:0}

/* board */
.board-wrap{container-type:inline-size}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.sq{position:relative;display:grid;place-items:center;background:var(--sq-l);min-width:0;min-height:0;overflow:hidden}
.sq.d{background:var(--sq-d)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.hit::before{background:var(--hit)}
.pc{position:relative;z-index:1;font:9.6cqw/1 var(--font-glyph);user-select:none}
.pc.w{color:var(--pw);text-shadow:1px 0 0 var(--pw-edge),-1px 0 0 var(--pw-edge),0 1px 0 var(--pw-edge),0 -1px 0 var(--pw-edge),0 0 3px var(--pw-edge)}
.pc.b{color:var(--pb);text-shadow:0 0 2px var(--pb-edge),0 0 1px var(--pb-edge)}
.pc.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:translateY(-35%) scale(1.25);opacity:.3}60%{transform:translateY(4%) scale(.96);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.pc.pop{animation:none}}
.coord{position:absolute;z-index:2;font:500 clamp(8px,2cqw,11px)/1 var(--font-mono);color:var(--sq-d);opacity:.9}
.sq.d .coord{color:var(--sq-l)}
.coord.r{top:3px;left:4px}.coord.f{bottom:3px;right:4px}

.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:42px;height:38px;cursor:pointer;font-size:15px}
.nav button:hover:not(:disabled){border-color:var(--accent)}
.nav button:disabled{opacity:.4;cursor:default}
.nav .where{margin-left:auto;color:var(--muted);font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.caption{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:76px}
.caption h2{font:700 17px/1.25 var(--font-display);margin:0 0 3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.caption p{margin:0;color:var(--muted)}
.tag{font:600 12px/1 var(--font-body);border-radius:99px;padding:4px 9px;white-space:nowrap}
.tag.strong{background:var(--good-bg);color:var(--good)}
.tag.slip{background:var(--warn-bg);color:var(--warn)}
.tag.blunder{background:var(--bad-bg);color:var(--bad)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.trays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tray{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--muted);min-height:40px}
.tray b{display:block;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tray .gl{font:18px/1.2 var(--font-glyph);color:var(--ink);letter-spacing:1px}

/* right column */
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;min-width:0}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab strong{display:block;font:700 16px/1.2 var(--font-display)}
.tab span{font-size:13px;color:var(--muted)}
.moves{display:grid;gap:10px}
.move{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;gap:8px}
.move.done{cursor:pointer}
.move.done:hover{border-color:var(--accent)}
.move header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mno{font:700 14px var(--font-display);letter-spacing:.02em}
.habits{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.habits label{display:flex;gap:11px;align-items:flex-start;padding:6px 0;cursor:pointer}
.habits label.locked{cursor:not-allowed;color:var(--muted)}
.habits input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.habits small{display:block;color:var(--muted);font-size:12.5px}
.played{font:500 13px var(--font-mono);color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:12px 16px;cursor:pointer;width:100%}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;cursor:pointer;width:100%;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0}
.log{display:flex;flex-wrap:wrap;gap:4px}
.mv{font:500 13px var(--font-mono);border:1px solid transparent;background:none;border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--ink)}
.mv:hover{border-color:var(--line)}
.mv.cur{background:var(--accent);color:var(--accent-ink)}
.mv.slip{color:var(--warn)}.mv.blunder{color:var(--bad)}
.mv.cur.slip,.mv.cur.blunder{color:var(--accent-ink)}
.num{font:500 13px var(--font-mono);color:var(--muted);padding:3px 0 3px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.card h2{font:700 20px/1.2 var(--font-display);margin:0}
.card ul{margin:0;padding-left:18px;display:grid;gap:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px}
.foot label{display:flex;gap:8px;align-items:center;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.linkbtn.danger{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

.board.live .sq{cursor:pointer}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.dot::after{content:"";position:absolute;z-index:2;width:28%;height:28%;border-radius:50%;background:rgba(15,31,39,.42)}
.sq.cdot::after{content:"";position:absolute;z-index:2;inset:5%;border-radius:50%;border:4px solid rgba(15,31,39,.45)}
.prompt{border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.prompt.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prompt.done{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tabs{flex-wrap:wrap}.tab{min-width:120px}
body{background:linear-gradient(160deg,#cdbcf0 0%,#ebe1fa 50%,#fde4ef 100%) fixed}
.card,.move,.caption,.tab,.tray,.prompt,.stat{border:0;border-radius:22px;box-shadow:0 8px 24px rgba(110,80,190,.14),inset 0 1px 0 #fff}
.move{border-radius:18px}.stat{border-radius:16px;box-shadow:none;background:#f4edff}

 body{padding-block:12px 28px}

/* ---------- engine: tiny search so the board can play good, shaky and terrible moves ---------- */
const PV={p:100,n:320,b:330,r:500,q:900,k:0};
const MATE=100000, INF=1e9;
const BOOK=['e2e4','e7e5','g1f3','b8c6','f1c4','f8c5','c2c3','g8f6','d2d3','d7d6','e1g1','e8g8','b1d2','a7a6','f1e1','c5a7','c4b3','f8e8','d2f1','h7h6'];

function evalPos(g){
  const b=g.board();let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=b[r][c];if(!p)continue;
    const rank=8-r,file=c,w=p.color==='w',home=w?1:8,rel=w?rank:9-rank;
    const center=(file>=3&&file<=4&&rank>=4&&rank<=5)?12:((file>=2&&file<=5&&rank>=3&&rank<=6)?5:0);
    let pos=0;
    if(p.type==='p'){pos=center+(rel-2)*3;if((file===5||file===6)&&rel>2)pos-=12;}
    else if(p.type==='n'||p.type==='b'){pos=center+(rank!==home?14:0);if(file===0||file===7)pos-=8;}
    else if(p.type==='q'){if(rank!==home&&rel<=3)pos-=0;if(rank!==home)pos-=6;}
    else if(p.type==='k'){if(rank===home&&(file===6||file===2))pos+=30;else if(rank!==home)pos-=25;}
    s+=(w?1:-1)*(PV[p.type]+pos);
  }
  return s;
}
function legal(g){return g.moves({verbose:true}).filter(m=>!m.promotion||m.promotion==='q');}
function sortMoves(ms){
  const k=m=>(m.captured?PV[m.captured]*10-PV[m.piece]:0)+(m.promotion?800:0);
  return ms.sort((a,b)=>k(b)-k(a));
}
function playMove(g,m){return g.move({from:m.from,to:m.to,promotion:m.promotion||undefined});}
function negamax(g,d,alpha,beta){
  if(d===0)return (g.turn()==='w'?1:-1)*evalPos(g);
  if(g.game_over())return g.in_checkmate()?-MATE-d:0;
  let best=-INF;
  for(const m of sortMoves(legal(g))){
    playMove(g,m);
    const v=-negamax(g,d-1,-beta,-alpha);
    g.undo();
    if(v>best)best=v;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function rankMoves(g,depth){
  const out=[];
  for(const m of sortMoves(legal(g))){
    playMove(g,m);
    const sc=-negamax(g,depth-1,-INF,INF);
    g.undo();
    out.push({m,sc});
  }
  return out;
}
function bookMove(g,uci){
  for(let i=0;i<uci.length;i++)if(uci[i]!==BOOK[i])return null;
  const u=BOOK[uci.length];if(!u)return null;
  return legal(g).find(x=>x.from+x.to===u)||null;
}
/* q: 'strong' | 'slip' | 'blunder' for White (you). n = move number 1..10 */
function pickWhite(g,q,n,uci){
  if(q==='strong'){const bm=bookMove(g,uci);if(bm)return bm;}
  const r=rankMoves(g,3).sort((a,b)=>b.sc-a.sc);
  const best=r[0];
  if(q==='strong')return best.m;
  const pool=r.filter(x=>x.sc>-MATE/2);
  if(q==='slip'){
    const target=best.sc-150;let pick=null,dist=1e9;
    for(const x of pool){if(x.sc<best.sc-40){const d=Math.abs(x.sc-target);if(d<dist){dist=d;pick=x;}}}
    return (pick||pool[Math.min(pool.length-1,Math.ceil(pool.length/3))]).m;
  }
  const worst=pool.slice().reverse();
  return worst[Math.min(worst.length-1,n%3)].m;
}
function pickBlack(g,uci,depth){
  const bm=bookMove(g,uci);if(bm)return bm;
  const r=rankMoves(g,depth||2);let best=r[0];
  for(const x of r)if(x.sc>best.sc)best=x;
  return best.m;
}
const VAL={p:1,n:3,b:3,r:5,q:9};
function materialFromFen(fen){
  let w=0,b=0;
  for(const ch of fen.split(' ')[0]){const l=ch.toLowerCase();if(VAL[l]){if(ch===l)b+=VAL[l];else w+=VAL[l];}}
  return {w,b,diff:w-b};
}

function missedList(){const o=[];for(const d of[1,2])S.checks[d].forEach((v,i)=>{if(!v)o.push(HABITS[hix(d,i)].t+' (Day '+d+')');});return o;}

}

{const wt=setInterval(()=>{if(document.getElementById('intro')||document.getElementById('nameask'))return;clearInterval(wt);showWelcome();},300);}

}
function confetti(){const c=document.createElement('div');c.className='confetti';const k=['#c9a96a','#9a7fe6','#f3e9d2','#d58fe0','#453672'];
  for(let i=0;i<70;i++){const e=document.createElement('i');e.style.cssText='left:'+Math.random()*100+'%;background:'+k[i%5]+';animation-delay:'+Math.random()*1.2+'s;animation-duration:'+(2.6+Math.random()*2)+'s';c.appendChild(e);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),6500);}
function syncHTML(){return '<div><h2>Your name</h2><div class="chips"><input id="nm-set" class="tok" type="text" maxlength="30" value="'+esc(NM)+'" placeholder="Your name"><button class="chip" data-act="setname">Save</button></div></div><div><h2>Sync with GitHub</h2>'+(SY.token?'<p class="hint" style="margin:0 0 8px">'+esc(SY.msg||'Connected')+'</p><div class="chips"><button class="chip" data-act="syncnow">Sync now</button><button class="chip" data-act="syncoff">Disconnect</button></div>':'<p class="hint" style="margin:0 0 8px">Paste a GitHub token (classic, “gist” permission only) to keep your phone and computer in sync.</p><div class="chips"><input id="gh-token" class="tok" type="password" placeholder="ghp_…" autocomplete="off"><button class="chip" data-act="syncon">Connect</button></div>')+'</div>';}
function histHTML(){return '<div><h2>Past games</h2>'+(HIST.length?'<ul class="hist">'+HIST.slice(0,8).map(h=>'<li><b>'+(h.won?'Won':isDraw(h.res)?'Draw':'Lost')+'</b> · '+new Date(h.at).toLocaleDateString()+' · '+h.kept+'/20 rules kept</li>').join('')+'</ul>':'<p class="hint" style="margin:0">No finished games yet.</p>')+'</div>';}
async function ghx(path,opt){const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+SY.token,'Content-Type':'application/json'}}));if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
const FN='daily-gambit.json',GD='The Daily Gambit sync';
const pack=()=>JSON.stringify({ts:TS,state:S,hist:HIST,look:LK,name:NM});
async function ensureGist(){if(SY.gist)return;const l=await ghx('/gists?per_page=100'),f=l.find(g=>g.description===GD&&g.files[FN]);
  if(f)SY.gist=f.id;else{const g=await ghx('/gists',{method:'POST',body:JSON.stringify({description:GD,public:false,files:{[FN]:{content:pack()}}})});SY.gist=g.id;}saveSY();}
async function syncPushNow(){if(!SY.token)return;try{await ensureGist();await ghx('/gists/'+SY.gist,{method:'PATCH',body:JSON.stringify({files:{[FN]:{content:pack()}}})});SY.msg='Synced '+new Date().toLocaleTimeString();}catch(e){SY.msg='Sync problem: '+e.message;}saveSY();}
function schedulePush(){if(!SY.token)return;clearTimeout(pushT);pushT=setTimeout(syncPushNow,2000);}
function applyRemote(d){S=d.state||null;memo=S;HIST=d.hist||HIST;if(d.look&&BOARDS[d.look.board]&&THEMES[d.look.theme])LK=d.look;TS=d.ts;if(d.name)NM=d.name;
  try{localStorage.setItem('dailygambit.name',NM);S?localStorage.setItem(KEY,JSON.stringify(S)):localStorage.removeItem(KEY);localStorage.setItem('dailygambit.hist',JSON.stringify(HIST));localStorage.setItem('dailygambit.look',JSON.stringify(LK));localStorage.setItem('dailygambit.ts',TS);}catch(e){}
  ui.view=S?S.plies.length:0;ui.day=S?(S.battle||S.result?3:S.closed[1]?2:1):1;ui.sel=null;ui.dests=[];ui.cq=null;render();}
async function syncPull(){if(!SY.token||ui.busy||syncing)return;syncing=true;
  try{await ensureGist();const g=await ghx('/gists/'+SY.gist),f=g.files[FN];let d=null;
    if(f){const c=f.truncated?await(await fetch(f.raw_url)).text():f.content;try{d=JSON.parse(c);}catch(e){}}
    if(d&&d.ts>TS)applyRemote(d);else if(!d||d.ts<TS)await syncPushNow();
    SY.msg='Synced '+new Date().toLocaleTimeString();}catch(e){SY.msg='Sync problem: '+e.message;}
  syncing=false;saveSY();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull();});setInterval(syncPull,45000);setTimeout(syncPull,500);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});


const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));};
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayDate=d=>addDays(S.start,d-1);
const today=()=>ymd(new Date());
const inWakeWindow=()=>{const h=new Date().getHours();return h>=4&&h<6;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const hix=(d,i)=>i,mvn=(d,i)=>(d-1)*10+i+1;

function newGame(offset){
  ui.cq=null;S={start:addDays(today(),offset),checks:{1:Array(10).fill(false),2:Array(10).fill(false)},closed:{1:false,2:false},plies:[],uci:[],queue:[],qi:0,battle:false,result:null,demo:false};
  save();ui.view=0;ui.day=1;ui.sel=null;ui.dests=[];render();
}
function canTick(d,i){
  if(S.closed[d])return false;
  if(S.demo)return true;
  if(today()<dayDate(d))return false;
  if(HABITS[hix(d,i)].gate)return today()===dayDate(d)&&inWakeWindow();
  return true;
}
function movesDone(){return S.qi>=S.queue.length;}
function closeReason(d){
  if(S.closed[d])return 'Already played.';
  if(d===2&&!(S.closed[1]&&movesDone()))return "Finish Day 1's moves first.";
  if(!S.demo&&today()<dayDate(d))return 'Opens '+fmtDate(dayDate(d))+'.';
  return '';
}
function live(){return new Chess(S.plies.length?S.plies[S.plies.length-1].fen:START_FEN);}
function curItem(){return S.qi<S.queue.length?S.queue[S.qi]:null;}
function myTurn(){
  if(!S||ui.busy||S.result)return false;
  const it=curItem();
  return it?it.kept:S.battle;
}
function checkEnd(g){
  if(g.in_checkmate())return g.turn()==='b'?'Checkmate. You win.':'Checkmate. Black wins.';
  if(g.in_stalemate())return 'Stalemate. The game is a draw.';
  if(g.in_draw())return 'The game is drawn.';
  return null;
}
const nextN=()=>Math.floor(S.plies.length/2)+1;
function pushRender(){ui.view=S.plies.length;ui.pop=true;save();render();}
function joinNames(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}

/* ---------- play ---------- */
async function blackReply(g,wply,mat0,forced){
  const res=checkEnd(g);
  if(res){S.result=res;wply.note.p+=' '+res;return;}
  await wait(900);
  const bm=pickBlack(g,S.uci,S.battle?3:2);
  playMove(g,bm);S.uci.push(bm.from+bm.to);
  const bply={n:wply.n,side:'b',san:bm.san,from:bm.from,to:bm.to,fen:g.fen(),cap:bm.captured||null,q:wply.q};
  S.plies.push(bply);
  const swing=materialFromFen(g.fen()).diff-mat0;
  let reply=bm.captured?'Black takes your '+NAMES[bm.captured]+' on '+bm.to+'.':'Black answers '+bm.san+'.';
  if(forced){
    if(swing<=-100)reply+=' That costs you '+(Math.abs(swing)/100)+' point'+(Math.abs(swing)===100?'':'s')+' of material.';
    else reply+=' Black has the easier position now.';
  }
  const end=checkEnd(g);
  if(end){S.result=end;reply+=' '+end;}
  bply.note={h:reply,p:''};
}
async function advance(){
  if(ui.busy||!S)return;
  ui.busy=true;render();
  while(!S.result){
    const it=curItem();
    if(!it||it.kept)break;
    await wait(1000);
    const g=live(),n=nextN(),mat0=materialFromFen(g.fen()).diff;
    const wm=pickWhite(g,'blunder',n,S.uci);
    playMove(g,wm);S.uci.push(wm.from+wm.to);
    ui.q=pickQuote('r');const wply={n,side:'w',san:wm.san+'??',from:wm.from,to:wm.to,fen:g.fen(),q:'blunder',cap:wm.captured||null,note:{h:'Rule missed: '+it.label+'.',p:'The board plays '+wm.san+'?? for you. A lesson, not a verdict.'}};
    S.plies.push(wply);pushRender();
    await blackReply(g,wply,mat0,true);
    S.qi++;pushRender();
  }
  if(!S.result&&movesDone()&&S.closed[2]&&!S.battle)S.battle=true;
  save();ui.busy=false;ui.pop=false;render();
}
async function userMove(from,to){
  const g=live();
  const m=g.moves({verbose:true}).find(x=>x.from===from&&x.to===to&&(!x.promotion||x.promotion==='q'));
  if(!m)return;
  ui.busy=true;ui.sel=null;ui.dests=[];
  const it=curItem(),n=nextN(),mat0=materialFromFen(g.fen()).diff;
  playMove(g,m);S.uci.push(from+to);
  const wply={n,side:'w',san:m.san,from,to,fen:g.fen(),q:it?'strong':'free',cap:m.captured||null,
    note:{h:it?'Rule kept: '+it.label+'.':'You play '+m.san+'.',p:it?'Your move: '+m.san+'.':''}};
  S.plies.push(wply);pushRender();
  await blackReply(g,wply,mat0,false);
  if(it)S.qi++;
  save();ui.busy=false;pushRender();
  await advance();
}
function closeDay(d){
  if(ui.busy||closeReason(d))return;
  S.closed[d]=true;
  for(let i=0;i<10;i++)S.queue.push({d,kept:!!S.checks[d][i],label:HABITS[hix(d,i)].t});
  save();ui.day=d;ui.sel=null;ui.dests=[];render();advance();
}
function stopPlay(){if(ui.timer){clearInterval(ui.timer);ui.timer=null;}}
function startPlay(from){
  stopPlay();ui.view=from;ui.pop=false;ui.sel=null;ui.dests=[];render();
  if(S.plies.length<=from)return;
  ui.timer=setInterval(()=>{
    if(ui.view>=S.plies.length){stopPlay();render();return;}
    ui.view++;ui.pop=true;render();
    if(ui.view>=S.plies.length)stopPlay();
  },1300);
}

function pickQuote(tag){
  const pool=QUOTES.filter(q=>(!tag||tag==='a'||q.t===tag||q.t==='a')&&q!==ui.q);
  return pool[Math.floor(Math.random()*pool.length)];
}
ui.q=pickQuote();
function heroHTML(){
  const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',q=ui.q;

}

/* ---------- rendering ---------- */
function boardHTML(fen,ply,pop,interactive){
  const rows=fen.split(' ')[0].split('/');
  let h='<div class="board-wrap"><div class="board'+(interactive?' live':'')+'" role="img" aria-label="Chess board">';
  const files='abcdefgh';
  for(let r=0;r<8;r++){
    let c=0;
    const cell=(ch)=>{
      const name=files[c]+(8-r),dark=(r+c)%2===1;
      let cls='sq'+(dark?' d':'');
      if(ply&&(ply.from===name||ply.to===name))cls+=' last';
      if(ply&&ply.cap&&ply.to===name)cls+=' hit';
      if(interactive&&ui.sel===name)cls+=' sel';
      if(interactive&&ui.dests.includes(name))cls+=ch?' cdot':' dot';
      let inner='';
      if(c===0)inner+='<span class="coord r">'+(8-r)+'</span>';
      if(r===7)inner+='<span class="coord f">'+files[c]+'</span>';
      if(ch){
        const l=ch.toLowerCase(),col=ch===l?'b':'w';
        inner+='<span class="pc '+col+(pop&&ply&&ply.to===name?' pop':'')+'">'+GLY[l]+'︎</span>';
      }
      c++;return '<div class="'+cls+'" data-act="sq" data-sq="'+name+'">'+inner+'</div>';
    };
    for(const ch of rows[r]){
      if(/\d/.test(ch)){for(let k=0;k<+ch;k++)h+=cell(null);}else h+=cell(ch);
    }
  }
  return h+'</div></div>';
}
function lost(fen){
  const cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  for(const ch of fen.split(' ')[0]){const l=ch.toLowerCase();if(cnt.w[l]!==undefined)cnt[ch===l?'b':'w'][l]++;}
  const start={p:8,n:2,b:2,r:2,q:1},out={w:'',b:''};
  for(const s of ['w','b'])for(const k of ['q','r','b','n','p'])for(let i=0;i<start[k]-cnt[s][k];i++)out[s]+=GLY[k]+'︎';
  return out;
}
function matText(fen){
  const m=materialFromFen(fen).diff;
  return m===0?'Material level':m>0?'You are up '+m:'The board is up '+Math.abs(m);
}
function chipFor(d,i){
  const n=mvn(d,i);
  if(S.closed[d]){
    const wp=S.plies.find(p=>p.n===n&&p.side==='w'&&p.q!=='free');
    if(wp)return wp.q==='strong'?'<span class="tag strong">Your move</span>':'<span class="tag blunder">Forced bad move</span>';
    const idx=S.queue.findIndex((q,k)=>k===(d-1)*10+i);
    if(idx===S.qi&&!S.result)return '<span class="tag plain">'+(S.queue[idx].kept?'Your turn':'Next')+'</span>';
    return '<span class="tag plain">Queued</span>';
  }
  return '<span class="tag plain">'+(S.checks[d][i]?'Kept: you move':'Not kept: forced bad move')+'</span>';
}
function dayHTML(d){
  const ch=S.checks[d],done=S.closed[d];let h='<div class="moves">';
  for(let i=0;i<10;i++){
    const k=hix(d,i),H=HABITS[k],ok=canTick(d,i);
    let hint=H.h||'';
    if(H.gate&&!ok&&!ch[i]&&!done&&!S.demo)hint=today()<dayDate(d)?'Opens '+fmtDate(dayDate(d))+', 4:00 to 6:00 am':today()===dayDate(d)&&!inWakeWindow()?'Locked. The 4:00 to 6:00 am window is not open right now.':'Locked. The window has passed.';
    h+='<article class="move"><header><span class="mno">Move '+(k+1)+' of 10</span>'+chipFor(d,i)+'</header>'+
      '<ul class="habits"><li><label class="'+(ok||ch[i]?'':'locked')+'"><input type="checkbox" id="h-'+d+'-'+i+'" data-d="'+d+'" data-h="'+i+'"'+(ch[i]?' checked':'')+(ok?'':' disabled')+'><span>'+esc(H.t)+(hint?'<small>'+esc(hint)+'</small>':'')+'</span></label></li></ul></article>';
  }
  return h+'</div>';
}
function battleHTML(){
  if(!S.battle&&!S.result)return '<section class="card"><h2>Final battle</h2><p style="margin:0">Opens once Day 2\'s ten moves are played. The rules stop, and you play on from that exact position. You try to checkmate Black, Black tries to checkmate you. It ends at checkmate, resignation or a draw.</p></section>';
  if(S.result)return finalHTML();
  return '<section class="card"><h2>Final battle</h2><p style="margin:0">No more rules. Make your own moves and try to checkmate Black.</p><button class="secondary" data-act="resign">'+(ui.confirmResign?'Tap again to resign':'Resign')+'</button></section>';

function summaryHTML(){
  const ws=S.plies.filter(p=>p.side==='w'&&p.q!=='free');

  const strong=ws.filter(p=>p.q==='strong').length,forced=ws.filter(p=>p.q==='blunder').length;

  else v='The board is badly damaged. Play carefully and look for tricks.';
  return '<section class="card"><h2>Accountability result</h2><div class="stats">'+
    '<div class="stat"><b>'+kept+'/20</b><span>rules kept</span></div>'+
    '<div class="stat"><b>'+strong+'</b><span>your own moves</span></div>'+
    '<div class="stat"><b>'+forced+'</b><span>forced bad moves</span></div></div>'+

function startHTML(){
  const late=new Date().getHours()>=6;

  heroHTML()+'<div class="cols"><div class="col">'+boardOrSlot(START_FEN,null,false,false)+'</div><div class="col">'+

  '<li>Both days use the same ten rules. Each rule is one White move, so that is ten moves a day over two days.</li>'+
  '<li>Rule kept: you choose your own legal move.</li>'+

  '</div></div>';
}
function gameHTML(){
  const plies=S.plies,v=ui.view,cur=v>0?plies[v-1]:null,total=plies.length;
  const fen=cur?cur.fen:START_FEN;
  const atLive=v===total,mine=myTurn(),interactive=mine&&atLive;
  const where=v===0?'Start':'Move '+cur.n+' · '+(cur.side==='w'?'You':'Black');
  const note=cur?cur.note||{h:'',p:''}:{h:'Starting position.',p:'Tick Day 1\'s rules as you complete them, then close the day.'};
  const tagFor=cur&&cur.side==='w'&&cur.q!=='free'?'<span class="tag '+cur.q+'">'+(cur.q==='strong'?'Your move':'Forced')+'</span>':'';

  };
  let log='';
  plies.forEach((p,i)=>{
    if(p.side==='w')log+='<span class="num">'+p.n+'.</span>';
    log+='<button class="mv'+(p.side==='w'&&p.q==='blunder'?' blunder':'')+(i+1===v?' cur':'')+'" data-act="goto" data-i="'+(i+1)+'">'+esc(p.san)+'</button>';
  });
  const panel=d===3?battleHTML():dayHTML(d)+(S.closed[d]?'':'<button class="primary" data-act="close" data-d="'+d+'" '+(rs||ui.busy?'disabled':'')+'>Close Day '+d+' and play 10 moves</button><p class="hint">'+(rs?esc(rs)+' ':'')+(rs&&rs.indexOf('Opens')===0?'<button class="linkbtn" data-act="demo">Play now instead</button> ':'')+'Unticked rules become forced bad moves.</p>');
  return '<header class="top">'+brand('Be kind to yourself, keep your rules, and watch the board answer.')+''+
  '<div class="status"><span class="pill">'+matText(fen)+'</span><span class="pill">'+(S.result?'Game over':S.battle?'Final battle':S.closed[1]?'Day 2':'Day 1')+'</span><button class="gvbtn" data-act="v3">'+(ui.v3?'2D board':'3D board')+'</button><button class="gvbtn" data-act="look">'+(ui.look?'Close settings':'Settings')+'</button><button class="gvbtn" data-act="gv">'+(ui.gv?'Show habits':'Game view')+'</button></div></header>'+heroHTML()+
  '<div class="cols"><div class="col">'+boardOrSlot(fen,cur,ui.pop,interactive)+prompt+

function render(){

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='start')return newGame(+t.dataset.o);
  if(a==='quote'){ui.q=pickQuote();return render();}
  if(a==='v3'){ui.v3=!ui.v3;return render();}
  if(a==='look'){ui.look=!ui.look;return render();}
  if(a==='setname'){NM=((document.getElementById('nm-set')||{}).value||'').trim();saveName();return render();}
  if(a==='newgame')return newGame(+t.dataset.o);
  if(a==='syncon'){const v=((document.getElementById('gh-token')||{}).value||'').trim();if(v){SY={token:v,gist:'',msg:'Connecting…'};saveSY();render();syncPull().then(render);}return;}
  if(a==='syncnow'){SY.msg='Syncing…';render();syncPull().then(render);return;}
  if(a==='syncoff'){SY={token:'',gist:'',msg:''};saveSY();return render();}
  if(a==='demo'&&S){S.demo=true;save();return render();}
  if(a==='bt'||a==='th'){LK[a==='bt'?'board':'theme']=t.dataset.v;saveLook();return render();}
  if(!S)return;
  if(a==='sq'){
    if(!myTurn()||ui.view!==S.plies.length)return;
    const sq=t.dataset.sq,g=live();
    if(ui.sel&&ui.dests.includes(sq)){const from=ui.sel;ui.sel=null;ui.dests=[];render();return userMove(from,sq);}
    const p=g.get(sq);
    if(p&&p.color==='w'){ui.sel=sq;ui.dests=g.moves({square:sq,verbose:true}).map(m=>m.to);}
    else{ui.sel=null;ui.dests=[];}
    return render();
  }
  ui.sel=null;ui.dests=[];
  if(['goto','first','prev','next','last'].includes(a))stopPlay();
  if(a==='goto'){ui.view=+t.dataset.i;ui.pop=true;}
  else if(a==='first')ui.view=0;
  else if(a==='prev')ui.view=Math.max(0,ui.view-1);
  else if(a==='next'){ui.view=Math.min(S.plies.length,ui.view+1);ui.pop=true;}
  else if(a==='last')ui.view=S.plies.length;
  else if(a==='replay')return startPlay(0);
  else if(a==='tab')ui.day=+t.dataset.d;
  else if(a==='gv')ui.gv=!ui.gv;
  else if(a==='close')return closeDay(+t.dataset.d);
  else if(a==='resign'){
    if(!ui.confirmResign){ui.confirmResign=true;setTimeout(()=>{ui.confirmResign=false;if(S)render();},4000);}
    else{ui.confirmResign=false;S.result='You resigned. Black wins.';save();}
  }
  else if(a==='reset'){
    if(!ui.confirmReset){ui.confirmReset=true;setTimeout(()=>{ui.confirmReset=false;if(S)render();},4000);}
    else{stopPlay();wipe();S=null;ui.confirmReset=false;ui.view=0;}
  }
  render();
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='demo'){S.demo=t.checked;save();render();return;}
  if(t.dataset.h!==undefined){S.checks[+t.dataset.d][+t.dataset.h]=t.checked;ui.q=pickQuote(t.checked?'w':'a');save();render();}
});
render();
if(S&&!S.result&&S.queue.length&&!movesDone()&&!myTurn())advance();
setInterval(()=>{if(S&&!ui.busy&&!ui.timer)render();},60000);
